<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="elnunu">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C2A4E"/>
      <stop offset="1" stop-color="#43193A"/>
    </linearGradient>
  </defs>
  <!-- plum tile; the squircle keeps every platform's mask happy -->
