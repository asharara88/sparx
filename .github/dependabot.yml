# Dependabot keeps both package trees patched (docs/SECURITY_UPDATES.md).
# A security advisory on any dependency opens a pull request as soon as a fixed
# version exists; routine version updates arrive once a week, minor and patch
# bumps grouped into one pull request per tree so the log stays readable.
# CI runs on every one of them; merge when it is green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dubai
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: "deps(root)"
  - package-ecosystem: npm
    directory: /family
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Dubai
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: "deps(family)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
