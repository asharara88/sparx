# The elnunu family app in family/: typecheck, the unit tests, and the whole
# Supabase schema (family/supabase/migrations/*.sql) applied in order to a fresh
# Postgres followed by supabase/tests/rls_test.sql, the Step 1 to 6 database
# checks, then a production build. The Supabase GitHub integration applies those migrations to the
# household's project when a change lands on main, so a migration that does not
# apply, or a policy that lets the wrong role read, has to fail here first.
# (The YouTube studio and its dashboard, which had their own jobs, were removed on
# 2026-11-17.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  family:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: family
    services:
      postgres:
        # Same major as the local test runner; the household project runs 17 and
        # the migrations use nothing newer than 16 (pg_trgm is in contrib).
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The unit tests run on node's own test runner with --experimental-strip-types.
          node-version: 22
          cache: npm
          cache-dependency-path: family/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The unit tests include lib/setup/plan.test.ts: the household setup script's
      # matching, account-link and validation rules, exercised without a database.
      - run: npm test
      - name: The setup script parses (its logic is in lib/setup/plan.mjs, tested above)
        run: node --check scripts/setup-household.mjs
      - name: Migrations + RLS checks against a fresh Postgres
        env:
          PGPASSWORD: postgres
          PSQL: psql -h localhost -U postgres
        run: npm run db:test
      # The production build Vercel runs on every push, so a page or route that does not
      # compile fails the check a merge waits for. The two values are placeholders (the
      # ones CLAUDE.md names for a local build); the build reads no secret.
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_localscreenshotsonly000
        run: npm run build
