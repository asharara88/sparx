# Three jobs, one per app in the repo.
#
# test: the YouTube studio pipeline at the repo root. typecheck + full vitest
#   suite; ffmpeg is installed so the real render/probe/clip paths run instead of
#   gracefully skipping.
# web: the studio dashboard in web/: typecheck and a production build.
# family: the elnunu family app in family/. typecheck, the unit tests, and the
#   whole Supabase schema (family/supabase/migrations/*.sql) applied in order to
#   a fresh Postgres followed by supabase/tests/rls_test.sql, the Step 1 to 6
#   database checks. The Supabase GitHub integration applies those migrations to
#   the household's project when a change lands on main, so a migration that does
#   not apply, or a policy that lets the wrong role read, has to fail here first.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # vitest 5 (the security upgrade of 2026-10-23, docs/SECURITY_UPDATES.md) needs node 22.
          node-version: 22
          cache: npm
      - name: Install ffmpeg (real render path in tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  family:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: family
    services:
      postgres:
        # Same major as the local test runner; the household project runs 17 and
        # the migrations use nothing newer than 16 (pg_trgm is in contrib).
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # The unit tests run on node's own test runner with --experimental-strip-types.
          node-version: 22
          cache: npm
          cache-dependency-path: family/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The unit tests include lib/setup/plan.test.ts: the household setup script's
      # matching, account-link and validation rules, exercised without a database.
      - run: npm test
      - name: The setup script parses (its logic is in lib/setup/plan.mjs, tested above)
        run: node --check scripts/setup-household.mjs
      - name: Migrations + RLS checks against a fresh Postgres
        env:
          PGPASSWORD: postgres
          PSQL: psql -h localhost -U postgres
        run: npm run db:test
